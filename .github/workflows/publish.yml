# Publish to PyPI (and optionally Test PyPI).
# Trigger: GitHub Release published, or manual workflow_dispatch.
# Release tags containing '-rc' (e.g. v0.2.0-rc.1) publish to Test PyPI only; other tags publish to PyPI.
# Requires: PyPI Trusted Publisher configured for this repo, or PYPI_API_TOKEN secret.

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Upload to Test PyPI"
        required: false
        default: false
        type: boolean
      prod_pypi:
        description: "Upload to Production PyPI"
        required: false
        default: false
        type: boolean
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check built artifacts
        run: twine check dist/*

      - name: Store the distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to Test PyPI
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi == 'true') ||
      (github.event_name == 'release' && contains(github.event.release.tag_name, '-rc'))
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/pycontrolcharts

    permissions:
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to Prod PyPI
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.prod_pypi == 'true') ||
      (github.event_name == 'release' && !contains(github.event.release.tag_name, '-rc'))   
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pycontrolcharts
    permissions:
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to ProdPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
