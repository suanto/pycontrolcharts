# Run tests on a schedule (e.g. weekly) to catch dependency or environment regressions.
# Edit the cron below for weekly (default) or monthly.

name: Tests (scheduled)

on:
  schedule:
    # Weekly: Friday 22:00 UTC
    - cron: "0 22 * * 5"
    # Monthly (uncomment and comment weekly if preferred): 1st of month 00:00 UTC
    # - cron: "0 0 1 * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --strict-markers
